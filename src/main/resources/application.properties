spring.application.name=school-management-system
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8084}

# The dev/prod databases already have a schema created by Hibernate's ddl-auto=update (no
# migration tool was used until now), so on first run Flyway needs to adopt that existing state
# as "version 1" rather than trying to recreate it — baseline-on-migrate does this automatically
# whenever it finds tables but no flyway_schema_history yet. New migrations (V2+) then run
# normally on top of it. Disabled for the "test" profile (see application-test.properties),
# which uses a fresh H2 database recreated per run via ddl-auto=create-drop instead.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
