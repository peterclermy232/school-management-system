# Production profile: every secret and environment-specific value MUST come from the
# environment. There are intentionally no fallback defaults here so the app fails fast
# at startup instead of silently running with a dev credential.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# NOTE: there's no migration tool (Flyway/Liquibase) in this project yet, so `validate`
# would fail against an empty database on first deploy. Using `update` to match current
# behavior; switch to `validate` once schema migrations are introduced.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

logging.level.com.school=INFO
logging.level.org.springframework.security=WARN
