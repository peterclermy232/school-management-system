# Local development defaults. Not used in production (see application-prod.properties).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/school_management_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Dev-only secret. Override with the JWT_SECRET env var for any shared/non-local environment.
jwt.secret=${JWT_SECRET:2x93HdufABs8fEsfSDFasf832fsdfAB92fjadsklf1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

logging.level.com.school=DEBUG
