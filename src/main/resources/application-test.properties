# Used by the test suite (@ActiveProfiles("test")) so `mvn test` never needs a live Postgres.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
# Each test run gets a fresh H2 schema straight from the entities (see ddl-auto above) — no need
# to replay Postgres-flavored Flyway migrations against it.
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=dGVzdC1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q=
jwt.expiration=86400000

app.cors.allowed-origins=*

logging.level.com.school=WARN
